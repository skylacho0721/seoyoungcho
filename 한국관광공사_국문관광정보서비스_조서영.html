<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>공공데이터 여행 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --border: rgba(11,11,11,0.10);
    --gridline: #e1e0d9;

    --cat-1: #2a78d6; /* 관광지 · blue */
    --cat-2: #eb6834; /* 문화시설 · orange */
    --cat-3: #1baf7a; /* 축제공연행사 · aqua */
    --cat-4: #eda100; /* 여행코스 · yellow */
    --cat-5: #e87ba4; /* 레포츠 · magenta */
    --cat-6: #008300; /* 숙박 · green */
    --cat-7: #4a3aa7; /* 쇼핑 · violet */
    --cat-8: #e34948; /* 음식점 · red */
    --cat-etc: #898781;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --border: rgba(255,255,255,0.10);
      --gridline: #2c2c2a;

      --cat-1: #3987e5;
      --cat-2: #d95926;
      --cat-3: #199e70;
      --cat-4: #c98500;
      --cat-5: #d55181;
      --cat-6: #008300;
      --cat-7: #9085e9;
      --cat-8: #e66767;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Pretendard", -apple-system, "Malgun Gothic", sans-serif;
    background: var(--page);
    color: var(--text-primary);
  }

  /* ── Hero ── */
  .hero {
    position: relative;
    overflow: hidden;
    padding: 56px 24px 84px;
    text-align: center;
    background: linear-gradient(135deg, #2a3fb8 0%, #4a3aa7 45%, #e87ba4 100%);
    color: #ffffff;
  }
  .hero::before, .hero::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(50px);
    opacity: 0.45;
  }
  .hero::before {
    width: 340px; height: 340px;
    background: #2a78d6;
    top: -140px; left: -100px;
  }
  .hero::after {
    width: 300px; height: 300px;
    background: #eda100;
    bottom: -160px; right: -80px;
  }
  .hero-inner { position: relative; z-index: 1; }
  .hero h1 {
    margin: 0 0 10px;
    font-size: clamp(1.6rem, 4vw, 2.3rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    text-shadow: 0 2px 16px rgba(0,0,0,0.18);
  }
  .hero .subtitle {
    margin: 0 auto;
    max-width: 520px;
    font-size: 1rem;
    opacity: 0.92;
    font-weight: 500;
  }
  .credential {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 22px;
    padding: 8px 18px;
    border-radius: 999px;
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.3);
    backdrop-filter: blur(6px);
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .credential .dot { opacity: 0.6; }

  /* ── Layout ── */
  main {
    max-width: 920px;
    margin: -48px auto 0;
    padding: 0 16px 60px;
    position: relative;
    z-index: 2;
  }

  /* ── Search card ── */
  .search-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 18px;
    box-shadow: 0 20px 50px -20px rgba(20,20,40,0.35);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .search-input-wrap {
    flex: 1;
    min-width: 220px;
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-input-wrap .icon {
    position: absolute;
    left: 16px;
    font-size: 1.05rem;
    opacity: 0.55;
    pointer-events: none;
  }
  #keyword {
    width: 100%;
    padding: 14px 16px 14px 44px;
    border: 1px solid var(--border);
    border-radius: 14px;
    font-size: 1rem;
    font-family: inherit;
    background: var(--page);
    color: var(--text-primary);
  }
  #keyword:focus {
    outline: none;
    border-color: var(--cat-1);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--cat-1) 22%, transparent);
  }
  button {
    padding: 14px 22px;
    border: none;
    border-radius: 14px;
    font-size: 0.95rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
    color: #ffffff;
  }
  button:active:not(:disabled) { transform: translateY(1px) scale(0.99); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #searchBtn {
    background: linear-gradient(135deg, var(--cat-1), #4a3aa7);
    box-shadow: 0 10px 24px -10px color-mix(in srgb, var(--cat-1) 70%, transparent);
  }
  #searchBtn:hover:not(:disabled) { box-shadow: 0 14px 30px -10px color-mix(in srgb, var(--cat-1) 80%, transparent); }
  #downloadBtn {
    background: linear-gradient(135deg, var(--cat-4), var(--cat-2));
    box-shadow: 0 10px 24px -10px color-mix(in srgb, var(--cat-4) 70%, transparent);
  }
  #downloadBtn:hover:not(:disabled) { box-shadow: 0 14px 30px -10px color-mix(in srgb, var(--cat-4) 80%, transparent); }

  .status {
    min-height: 20px;
    margin: 4px 4px 18px;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .status.error { color: var(--cat-8); }

  .hidden { display: none !important; }
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .weather-card, .summary, .filter-row, .table-wrap {
    animation: riseIn 0.35s ease both;
  }

  /* ── Weather card ── */
  .weather-card {
    background: linear-gradient(120deg, color-mix(in srgb, var(--cat-1) 14%, var(--surface)), var(--surface));
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px 24px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 22px;
    flex-wrap: wrap;
  }
  .weather-main { display: flex; align-items: center; gap: 14px; }
  .weather-icon { font-size: 2.6rem; line-height: 1; }
  .weather-region { font-size: 0.85rem; color: var(--text-secondary); font-weight: 600; }
  .weather-temp { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
  .weather-stats { display: flex; gap: 18px; flex-wrap: wrap; margin-left: auto; }
  .weather-stat { text-align: center; }
  .weather-stat .v { font-size: 1rem; font-weight: 700; }
  .weather-stat .k { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

  /* ── Summary ── */
  .summary {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px 24px;
    margin-bottom: 18px;
  }
  .summary h2 {
    margin: 0 0 16px;
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--text-secondary);
  }
  .category-bars { display: flex; flex-direction: column; gap: 10px; }
  .category-bar-row { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; }
  .category-bar-label { width: 104px; flex-shrink: 0; display: flex; align-items: center; gap: 7px; color: var(--text-primary); font-weight: 600; }
  .category-bar-label .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .category-bar-track { flex: 1; background: var(--gridline); border-radius: 999px; overflow: hidden; height: 10px; }
  .category-bar-fill { height: 100%; border-radius: 999px; transition: width 0.4s ease; }
  .category-bar-count { width: 28px; text-align: right; color: var(--text-muted); font-weight: 700; font-size: 0.8rem; }

  /* ── Filters ── */
  .filter-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    flex-wrap: wrap; font-size: 0.85rem; color: var(--text-muted); font-weight: 600;
  }
  .filter-chips { display: flex; gap: 7px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px 6px 10px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); font-size: 0.82rem; font-weight: 600; cursor: pointer;
    color: var(--text-primary); transition: all 0.12s ease;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
  .chip:hover { border-color: color-mix(in srgb, var(--text-primary) 30%, transparent); }
  .chip.active {
    background: var(--chip-color, var(--text-primary));
    color: #ffffff;
    border-color: var(--chip-color, var(--text-primary));
  }
  .chip.active .dot { background: #ffffff !important; }

  /* ── Table ── */
  .table-wrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; overflow: hidden;
    box-shadow: 0 16px 40px -24px rgba(20,20,40,0.35);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  thead { background: color-mix(in srgb, var(--text-primary) 4%, var(--surface)); }
  th, td { text-align: left; padding: 13px 16px; border-bottom: 1px solid var(--gridline); }
  th { color: var(--text-muted); font-weight: 700; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
  td { color: var(--text-primary); }
  tbody tr { transition: background 0.1s ease; }
  tbody tr:hover { background: color-mix(in srgb, var(--text-primary) 3%, var(--surface)); }
  tbody tr:last-child td { border-bottom: none; }
  .cat-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 700;
    background: color-mix(in srgb, var(--badge-color, var(--text-muted)) 14%, var(--surface));
  }
  .cat-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--badge-color, var(--text-muted)); }
  td.addr { color: var(--text-secondary); }
  td.tel { color: var(--text-muted); font-variant-numeric: tabular-nums; }

  footer {
    text-align: center;
    padding: 28px 16px 40px;
    color: var(--text-muted);
    font-size: 0.8rem;
    line-height: 1.7;
  }
  footer .credit { font-weight: 700; color: var(--text-secondary); }

  @media (max-width: 600px) {
    .category-bar-label { width: 78px; font-size: 0.78rem; }
    .weather-stats { margin-left: 0; }
  }
</style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <h1>🧭 공공데이터 여행 대시보드</h1>
      <p class="subtitle">키워드 하나로 관광공사·기상청 공공데이터를 모아 엑셀로 내려받으세요</p>
      <div class="credential">
        <span>🎓 한국외국어대학교 차이나데이터큐레이션학과</span>
        <span class="dot">·</span>
        <span>202304504 조서영</span>
      </div>
    </div>
  </header>

  <main>
    <section class="search-card">
      <div class="search-input-wrap">
        <span class="icon">🔍</span>
        <input id="keyword" type="text" placeholder="예: 경주, 강릉, 전주 한옥마을 ..." autocomplete="off" />
      </div>
      <button id="searchBtn">검색</button>
      <button id="downloadBtn" disabled>📥 엑셀 다운로드</button>
    </section>

    <section id="status" class="status"></section>
    <section id="weatherCard" class="weather-card hidden"></section>
    <section id="summary" class="summary hidden">
      <h2>분류별 결과 수</h2>
      <div id="categoryBars" class="category-bars"></div>
    </section>
    <section class="filter-row hidden" id="filterRow">
      <span>분류 필터</span>
      <div id="filterChips" class="filter-chips"></div>
    </section>
    <section class="table-wrap">
      <table id="resultTable">
        <thead>
          <tr><th>분류</th><th>이름</th><th>주소</th><th>전화번호</th></tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </section>
  </main>

  <footer>
    <p class="credit">한국외국어대학교 차이나데이터큐레이션학과 · 202304504 조서영</p>
    <p>데이터 출처: 한국관광공사 TourAPI, 기상청 단기예보 조회서비스 (공공데이터포털 data.go.kr)</p>
  </footer>

<script>
// ====== 여기 두 줄에 공공데이터포털에서 발급받은 본인의 인증키(Decoding)를 넣으세요 ======
const TOUR_API_KEY = 'YOUR_TOUR_API_KEY_HERE';
const WEATHER_API_KEY = 'YOUR_WEATHER_API_KEY_HERE';
// =====================================================================

const REGION_COORDS = {
  '서울': { nx: 60, ny: 127 }, '부산': { nx: 98, ny: 76 }, '대구': { nx: 89, ny: 90 },
  '인천': { nx: 55, ny: 124 }, '광주': { nx: 58, ny: 74 }, '대전': { nx: 67, ny: 100 },
  '울산': { nx: 102, ny: 84 }, '세종': { nx: 66, ny: 103 }, '수원': { nx: 60, ny: 121 },
  '춘천': { nx: 73, ny: 134 }, '강릉': { nx: 92, ny: 131 }, '청주': { nx: 69, ny: 106 },
  '전주': { nx: 63, ny: 89 }, '포항': { nx: 102, ny: 94 }, '제주': { nx: 52, ny: 38 },
  '여수': { nx: 73, ny: 66 }, '경주': { nx: 100, ny: 91 }, '안동': { nx: 91, ny: 106 },
  '목포': { nx: 50, ny: 67 }, '성남': { nx: 62, ny: 123 }, '고양': { nx: 57, ny: 128 },
  '용인': { nx: 64, ny: 119 }, '평택': { nx: 62, ny: 114 }, '천안': { nx: 63, ny: 110 },
  '원주': { nx: 76, ny: 122 }, '속초': { nx: 87, ny: 141 }, '통영': { nx: 87, ny: 68 },
  '거제': { nx: 90, ny: 69 }, '남해': { nx: 78, ny: 61 }, '가평': { nx: 61, ny: 132 },
};
const TOUR_CATEGORY = {
  12: '관광지', 14: '문화시설', 15: '축제공연행사', 25: '여행코스',
  28: '레포츠', 32: '숙박', 38: '쇼핑', 39: '음식점',
};
// 팔레트 슬롯과 동일한 순서로 카테고리별 CSS 변수를 매핑 (CVD-safe 고정 순서)
const CATEGORY_COLOR_VAR = {
  '관광지': '--cat-1', '문화시설': '--cat-2', '축제공연행사': '--cat-3', '여행코스': '--cat-4',
  '레포츠': '--cat-5', '숙박': '--cat-6', '쇼핑': '--cat-7', '음식점': '--cat-8',
};
function categoryColor(cat) {
  const varName = CATEGORY_COLOR_VAR[cat] || '--cat-etc';
  return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
}

const WEATHER_LABEL = { T1H: '기온(℃)', REH: '습도(%)', WSD: '풍속(m/s)', RN1: '1시간 강수량(mm)' };
const PTY_LABEL = { '0': '없음', '1': '비', '2': '비/눈', '3': '눈', '5': '빗방울', '6': '빗방울눈날림', '7': '눈날림' };
const PTY_ICON = { '0': '☀️', '1': '🌧️', '2': '🌨️', '3': '❄️', '5': '🌦️', '6': '🌨️', '7': '🌨️' };

function findRegion(keyword) {
  const name = Object.keys(REGION_COORDS).find((r) => keyword.includes(r));
  return name ? { name, ...REGION_COORDS[name] } : null;
}

function getBaseDateTime() {
  const kst = new Date(Date.now() + 9 * 60 * 60 * 1000);
  let hour = kst.getUTCHours();
  let date = kst;
  if (kst.getUTCMinutes() < 40) {
    date = new Date(kst.getTime() - 60 * 60 * 1000);
    hour = date.getUTCHours();
  }
  const yyyy = date.getUTCFullYear();
  const mm = String(date.getUTCMonth() + 1).padStart(2, '0');
  const dd = String(date.getUTCDate()).padStart(2, '0');
  return { base_date: `${yyyy}${mm}${dd}`, base_time: `${String(hour).padStart(2, '0')}00` };
}

async function searchTourItems(keyword) {
  const url = new URL('https://apis.data.go.kr/B551011/KorService2/searchKeyword2');
  url.searchParams.set('serviceKey', TOUR_API_KEY);
  url.searchParams.set('numOfRows', '50');
  url.searchParams.set('pageNo', '1');
  url.searchParams.set('MobileOS', 'ETC');
  url.searchParams.set('MobileApp', 'TourDataDashboard');
  url.searchParams.set('_type', 'json');
  url.searchParams.set('arrange', 'A');
  url.searchParams.set('keyword', keyword);

  const r = await fetch(url);
  const data = await r.json();
  const header = data?.response?.header;
  if (!header || header.resultCode !== '0000') {
    throw new Error(`TourAPI 오류: ${header?.resultMsg || '알 수 없는 오류'}`);
  }
  const items = data?.response?.body?.items?.item || [];
  const list = Array.isArray(items) ? items : [items];
  return list.map((it) => ({
    분류: TOUR_CATEGORY[it.contenttypeid] || '기타',
    이름: it.title || '',
    주소: it.addr1 || '',
    전화번호: it.tel || '',
  }));
}

async function getWeather(region) {
  const { base_date, base_time } = getBaseDateTime();
  const url = new URL('https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getUltraSrtNcst');
  url.searchParams.set('serviceKey', WEATHER_API_KEY);
  url.searchParams.set('pageNo', '1');
  url.searchParams.set('numOfRows', '10');
  url.searchParams.set('dataType', 'JSON');
  url.searchParams.set('base_date', base_date);
  url.searchParams.set('base_time', base_time);
  url.searchParams.set('nx', region.nx);
  url.searchParams.set('ny', region.ny);

  const r = await fetch(url);
  const data = await r.json();
  const header = data?.response?.header;
  if (!header || header.resultCode !== '00') return null;

  const items = data?.response?.body?.items?.item || [];
  const result = { 지역: region.name };
  items.forEach((it) => {
    if (it.category === 'PTY') result['PTY'] = it.obsrValue;
    else if (WEATHER_LABEL[it.category]) result[WEATHER_LABEL[it.category]] = it.obsrValue;
  });
  return result;
}

const keywordInput = document.getElementById('keyword');
const searchBtn = document.getElementById('searchBtn');
const downloadBtn = document.getElementById('downloadBtn');
const statusEl = document.getElementById('status');
const weatherCard = document.getElementById('weatherCard');
const summaryEl = document.getElementById('summary');
const categoryBars = document.getElementById('categoryBars');
const filterRow = document.getElementById('filterRow');
const filterChips = document.getElementById('filterChips');
const resultBody = document.getElementById('resultBody');

let currentItems = [];
let currentWeather = null;
let currentKeyword = '';
let activeFilter = '전체';

async function runSearch() {
  const keyword = keywordInput.value.trim();
  if (!keyword) { setStatus('키워드를 입력해주세요.', true); return; }

  if (TOUR_API_KEY === 'YOUR_TOUR_API_KEY_HERE' || WEATHER_API_KEY === 'YOUR_WEATHER_API_KEY_HERE') {
    setStatus('먼저 script 상단에 본인의 API 인증키를 입력해주세요.', true);
    return;
  }

  setStatus('검색 중...');
  searchBtn.disabled = true;
  downloadBtn.disabled = true;
  clearResults();

  try {
    const region = findRegion(keyword);
    const [tourItems, weather] = await Promise.all([
      searchTourItems(keyword),
      region ? getWeather(region).catch(() => null) : Promise.resolve(null),
    ]);

    currentItems = tourItems;
    currentWeather = weather;
    currentKeyword = keyword;
    activeFilter = '전체';

    if (currentItems.length === 0) {
      setStatus('검색 결과가 없습니다. 다른 키워드로 시도해보세요.', true);
    } else {
      setStatus(`총 ${currentItems.length}건의 관광정보를 찾았습니다.`);
      downloadBtn.disabled = false;
    }

    renderWeather();
    renderSummary();
    renderFilters();
    renderTable();
  } catch (e) {
    setStatus(e.message, true);
  } finally {
    searchBtn.disabled = false;
  }
}

function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.classList.toggle('error', isError);
}

function clearResults() {
  weatherCard.classList.add('hidden');
  summaryEl.classList.add('hidden');
  filterRow.classList.add('hidden');
  resultBody.innerHTML = '';
}

function renderWeather() {
  if (!currentWeather) { weatherCard.classList.add('hidden'); return; }
  const pty = currentWeather.PTY || '0';
  const icon = PTY_ICON[pty] || '🌤️';
  const state = PTY_LABEL[pty] || '';
  const temp = currentWeather['기온(℃)'];
  const stats = [
    { k: '체감/상태', v: state },
    { k: '습도', v: currentWeather['습도(%)'] ? currentWeather['습도(%)'] + '%' : '-' },
    { k: '풍속', v: currentWeather['풍속(m/s)'] ? currentWeather['풍속(m/s)'] + 'm/s' : '-' },
    { k: '강수량', v: currentWeather['1시간 강수량(mm)'] || '0' },
  ];
  weatherCard.innerHTML = `
    <div class="weather-main">
      <span class="weather-icon">${icon}</span>
      <div>
        <div class="weather-region">${escapeHtml(currentWeather['지역'])} 현재 날씨</div>
        <div class="weather-temp">${temp !== undefined ? temp + '℃' : '-'}</div>
      </div>
    </div>
    <div class="weather-stats">
      ${stats.map((s) => `<div class="weather-stat"><div class="v">${escapeHtml(String(s.v))}</div><div class="k">${s.k}</div></div>`).join('')}
    </div>
  `;
  weatherCard.classList.remove('hidden');
}

function renderSummary() {
  if (currentItems.length === 0) { summaryEl.classList.add('hidden'); return; }
  const counts = {};
  currentItems.forEach((it) => { counts[it.분류] = (counts[it.분류] || 0) + 1; });
  const max = Math.max(...Object.values(counts));
  categoryBars.innerHTML = Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .map(([cat, count]) => {
      const color = categoryColor(cat);
      return `
      <div class="category-bar-row">
        <span class="category-bar-label"><span class="dot" style="background:${color}"></span>${escapeHtml(cat)}</span>
        <div class="category-bar-track"><div class="category-bar-fill" style="width:${(count / max) * 100}%;background:${color}"></div></div>
        <span class="category-bar-count">${count}</span>
      </div>
    `;
    }).join('');
  summaryEl.classList.remove('hidden');
}

function renderFilters() {
  if (currentItems.length === 0) { filterRow.classList.add('hidden'); return; }
  const categories = ['전체', ...new Set(currentItems.map((it) => it.분류))];
  filterChips.innerHTML = categories.map((cat) => {
    const color = cat === '전체' ? null : categoryColor(cat);
    const style = color ? `style="--chip-color:${color}"` : '';
    const dot = color ? `<span class="dot" style="background:${color}"></span>` : '';
    return `<button type="button" class="chip ${cat === activeFilter ? 'active' : ''}" data-cat="${cat}" ${style}>${dot}${escapeHtml(cat)}</button>`;
  }).join('');
  filterChips.querySelectorAll('.chip').forEach((chip) => {
    chip.addEventListener('click', () => {
      activeFilter = chip.dataset.cat;
      renderFilters();
      renderTable();
    });
  });
  filterRow.classList.remove('hidden');
}

function renderTable() {
  const rows = activeFilter === '전체' ? currentItems : currentItems.filter((it) => it.분류 === activeFilter);
  resultBody.innerHTML = rows.map((it) => {
    const color = categoryColor(it.분류);
    return `
    <tr>
      <td><span class="cat-badge" style="--badge-color:${color}"><span class="dot"></span>${escapeHtml(it.분류)}</span></td>
      <td>${escapeHtml(it.이름)}</td>
      <td class="addr">${escapeHtml(it.주소)}</td>
      <td class="tel">${escapeHtml(it.전화번호) || '-'}</td>
    </tr>
  `;
  }).join('');
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function downloadExcel() {
  if (currentItems.length === 0) return;
  const wb = XLSX.utils.book_new();
  const tourSheet = XLSX.utils.json_to_sheet(currentItems.map(({ 분류, 이름, 주소, 전화번호 }) => ({ 분류, 이름, 주소, 전화번호 })));
  XLSX.utils.book_append_sheet(wb, tourSheet, '관광정보');
  if (currentWeather) {
    const { PTY, ...rest } = currentWeather;
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{ ...rest, 날씨상태: PTY_LABEL[PTY] || PTY }]), '날씨');
  }
  const counts = {};
  currentItems.forEach((it) => { counts[it.분류] = (counts[it.분류] || 0) + 1; });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(Object.entries(counts).map(([분류, 건수]) => ({ 분류, 건수 }))), '요약');
  XLSX.writeFile(wb, `공공데이터_${currentKeyword}.xlsx`);
}

searchBtn.addEventListener('click', runSearch);
downloadBtn.addEventListener('click', downloadExcel);
keywordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(); });
</script>
</body>
</html>
